# POC only (fork-only, not for merge): checks the task wiring of the test-organization SPIP
# (apache/gravitino#14093) on every push of a POC branch.
name: poc-test-org

on:
  push:
    branches: [ "claude/14092-poc-**", "branch-poc-14092**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      M: ":catalogs:catalog-jdbc-mysql"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Plan of `check` in the POC module and a control module
        run: |
          ./gradlew -q "$M:check" --dry-run -PskipWeb=true | tee mysql-check.txt
          ./gradlew -q :catalogs:catalog-jdbc-postgresql:check --dry-run -PskipWeb=true \
            | tee pg-check.txt
          grep -q "^$M:spotlessCheck " mysql-check.txt
          if grep -q "^$M:test " mysql-check.txt; then
            echo "::error::$M:check still runs $M:test"; exit 1
          fi
          grep -q '^:catalogs:catalog-jdbc-postgresql:test ' pg-check.txt
          echo "OK: $M:check runs no tests; postgresql (no plugin) unchanged"

      - name: Plan of the integration suite, its deploy variant and the shim
        run: |
          plan() { ./gradlew -q --dry-run -PskipWeb=true "$@" | tee -a plans.txt; }
          has() { grep -q "^$1 " <<<"$2" || { echo "::error::expected $1 in: ${*:3}"; exit 1; }; }
          hasnt() { ! grep -q "^$1 " <<<"$2" || { echo "::error::unexpected $1 in: ${*:3}"; exit 1; }; }

          p="$(plan "$M:integrationTest")"
          has "$M:requireDocker" "$p" integrationTest
          has "$M:integrationTest" "$p" integrationTest

          p="$(plan "$M:deployIntegrationTest")"
          has ":compileDistribution" "$p" deployIntegrationTest
          has "$M:deployIntegrationTest" "$p" deployIntegrationTest

          p="$(plan "$M:test")"
          hasnt "$M:integrationTest" "$p" "test, no flags"

          p="$(plan "$M:test" -PskipTests -PtestMode=deploy)"
          has "$M:integrationTest" "$p" "test -PskipTests (shim)"
          hasnt "$M:requireDocker" "$p" "test -PskipTests (shim)"
          hasnt ":compileDistribution" "$p" "test -PskipTests (shim)"

          p="$(plan "$M:test" -PskipITs -PskipDockerTests=false)"
          has "$M:integrationTest" "$p" "test -PskipITs (shim)"
          echo "OK: suite, variant and shim plans as expected"

      - name: Docker fail-fast
        run: |
          start=$(date +%s)
          if DOCKER_HOST=unix:///nonexistent.sock ./gradlew "$M:requireDocker" -PskipWeb=true \
              > fail-fast.txt 2>&1; then
            cat fail-fast.txt; echo "::error::requireDocker passed without Docker"; exit 1
          fi
          grep -q 'Docker is not available' fail-fast.txt
          echo "OK: failed fast in $(( $(date +%s) - start ))s (includes configuration)"
          ./gradlew "$M:requireDocker" -PskipWeb=true

      - name: Configuration cache report for the POC module
        run: |
          ./gradlew "$M:check" --dry-run -PskipWeb=true --configuration-cache \
            --configuration-cache-problems=warn | tail -n 30
          report="$(find build/reports/configuration-cache -name '*.html' | head -n 1)"
          echo "report: ${report:-none}"
          if [ -n "$report" ] && grep -q 'build-logic' "$report"; then
            echo "::warning::configuration cache problems mention build-logic"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: poc-wiring
          path: |
            *-check.txt
            plans.txt
            fail-fast.txt
            build/reports/configuration-cache
          if-no-files-found: ignore
          retention-days: 7

  # Runs the moved module's suites by name, without any root flag, and checks that every test class
  # in the module ran in exactly one suite (SPIP Guarantee 8).
  mysql-suites:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      M: ":catalogs:catalog-jdbc-mysql"
      D: "catalogs/catalog-jdbc-mysql"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Free up disk space
        run: dev/ci/util_free_space.sh

      - name: test (hermetic)
        run: |
          start=$(date +%s)
          ./gradlew "$M:test" -PskipWeb=true
          echo "test: $(( $(date +%s) - start ))s" >> timings.txt

      - name: integrationTest (containers and an embedded server)
        run: |
          start=$(date +%s)
          ./gradlew "$M:integrationTest" -PskipWeb=true
          echo "integrationTest: $(( $(date +%s) - start ))s" >> timings.txt

      - name: Executed classes per task
        if: always()
        run: |
          classes() {
            find "$D/build/test-results/$1" -name 'TEST-*.xml' 2>/dev/null \
              | sed -E 's#.*/TEST-(.*)\.xml#\1#' | sort
          }
          classes test > executed-test.txt
          classes integrationTest > executed-integrationTest.txt
          find "$D/src/test" "$D/src/integrationTest" -name '*.java' \
            \( -name 'Test*.java' -o -name '*IT.java' \) ! -name 'TestMysql.java' \
            | sed -E 's#.*/src/[^/]+/java/##; s#\.java$##; s#/#.#g' | sort > expected.txt
          sort executed-test.txt executed-integrationTest.txt > executed.txt
          {
            echo "### catalog-jdbc-mysql suites"
            echo; echo '```'; cat timings.txt 2>/dev/null
            echo; echo "test:"; sed 's/^/  /' executed-test.txt
            echo "integrationTest:"; sed 's/^/  /' executed-integrationTest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! diff expected.txt executed.txt; then
            echo "::error::executed classes differ from the module's test classes"; exit 1
          fi
          if grep -E '\.integration\.test\.|TestMysqlDataSource|TestMysql(Catalog|Database|Table)Operations$' \
              executed-test.txt; then
            echo "::error::a container or integration test ran in test"; exit 1
          fi
          echo "OK: $(wc -l < executed.txt) classes, each in one suite"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mysql-suites
          path: |
            executed*.txt
            expected.txt
            timings.txt
            ${{ env.D }}/build/test-results
            ${{ env.D }}/build/*.log
          if-no-files-found: ignore
          retention-days: 7
