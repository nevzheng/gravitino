name: unit-test

on:
  workflow_call:
    inputs:
      base-ref:
        type: string
        required: false
        default: ''
      base-sha:
        type: string
        required: false
        default: ''
      head-repository:
        type: string
        required: false
        default: ''
      head-sha:
        type: string
        required: false
        default: ''
      sync:
        type: string
        required: false
        default: ''
      source-changes:
        type: string
        required: false
        default: ''
      mcp-server-changes:
        type: string
        required: false
        default: ''
      maintenance-module-only-changes:
        type: string
        required: false
        default: ''
      medium-shards:
        type: string
        required: false
        default: ''

concurrency:
  group: fork-ci-unit-test-${{ inputs.head-sha || github.ref }}
  cancel-in-progress: true

jobs:
  # Reports a successful job when no source changed, so the suite still shows it ran.
  no-source-changes:
    runs-on: ubuntu-slim
    if: inputs.source-changes != 'true'
    steps:
      - run: echo "No source changes, so no unit tests run."

  # Small tests, then medium tests (Docker) next to the core lanes, then coverage. The stages are
  # Gradle tasks in gradle/ci-stages.gradle.kts.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 17 ]
    timeout-minutes: 120
    if: inputs.source-changes == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-and-sync
        with:
          base-ref: ${{ inputs.base-ref }}
          base-sha: ${{ inputs.base-sha }}
          head-repository: ${{ inputs.head-repository }}
          head-sha: ${{ inputs.head-sha }}
          sync: ${{ inputs.sync }}
        id: test-checkout

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: ${{ matrix.java-version }}

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Install dependencies
        run: |
          # libssl1.1 is not in the runner's apt sources, so the .deb is fetched directly.
          deb=libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          for host in archive.ubuntu.com nz2.archive.ubuntu.com security.ubuntu.com; do
            wget --tries=3 --timeout=30 -O "$deb" "https://$host/ubuntu/pool/main/o/openssl/$deb" && break
            rm -f "$deb"
          done
          [ -s "$deb" ] || { echo "Could not download $deb from any mirror" >&2; exit 1; }
          sudo dpkg -i "$deb"

      - name: Run maintenance module tests
        if: inputs.maintenance-module-only-changes == 'true'
        run: >-
          ./gradlew
          :maintenance:optimizer-api:build
          :maintenance:updaters:build
          :maintenance:optimizer:build
          :maintenance:jobs:build
          -PskipWeb=true
          -PskipITs
          -PskipDockerTests=false

      - name: Run small tests
        if: inputs.maintenance-module-only-changes != 'true'
        run: >-
          ./gradlew ciSmallTest
          --max-workers=2
          -PskipWeb=true
          -PskipITs
          -PskipDockerTests=false
          ${{ inputs.mcp-server-changes != 'true' && '-x :mcp-server:test' || '' }}

      - name: Upload coverage data
        if: steps.test-checkout.outputs.pull-request == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-test
          # build.gradle.kts anchors the artifact at the repository root, so the report paths keep
          # their module prefix, which jacoco_report.py uses to name modules.
          path: |
            build.gradle.kts
            **/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload unit tests report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit test report
          path: |
            build/reports
            catalogs-contrib/**/*.log
            catalogs-contrib/**/*.tar
            catalogs/**/*.log
            catalogs/**/*.tar

  medium-test:
    name: medium-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Shards and their modules are defined in gradle/ci-stages.gradle.kts.
        include: ${{ fromJSON(inputs.medium-shards) }}
    timeout-minutes: 120
    needs: test
    if: >-
      inputs.source-changes == 'true' &&
      inputs.maintenance-module-only-changes != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-and-sync
        with:
          base-ref: ${{ inputs.base-ref }}
          base-sha: ${{ inputs.base-sha }}
          head-repository: ${{ inputs.head-repository }}
          head-sha: ${{ inputs.head-sha }}
          sync: ${{ inputs.sync }}
        id: medium-checkout

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Install dependencies
        run: |
          # libssl1.1 is not in the runner's apt sources, so the .deb is fetched directly.
          deb=libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          for host in archive.ubuntu.com nz2.archive.ubuntu.com security.ubuntu.com; do
            wget --tries=3 --timeout=30 -O "$deb" "https://$host/ubuntu/pool/main/o/openssl/$deb" && break
            rm -f "$deb"
          done
          [ -s "$deb" ] || { echo "Could not download $deb from any mirror" >&2; exit 1; }
          sudo dpkg -i "$deb"

      - name: Run medium ${{ matrix.shard }} tests
        run: >-
          ./gradlew ${{ matrix.task }}
          --max-workers=2
          -PskipWeb=true
          -PskipITs
          -PskipDockerTests=false

      - name: Upload coverage data
        if: steps.medium-checkout.outputs.pull-request == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-medium-${{ matrix.shard }}
          path: |
            build.gradle.kts
            **/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload unit tests report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: medium test report ${{ matrix.shard }}
          path: |
            build/reports
            catalogs/**/*.log
            catalogs/**/*.tar

  core-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 17 ]
        # One job per core test lane, so each lane's results and coverage inputs are inspectable on
        # their own. Lanes are defined in core/build.gradle.kts.
        lane: [ unit, h2, mysql, postgresql ]
        include:
          - lane: unit
            task: coreUnitTest
            skip-docker-tests: true
          - lane: h2
            task: coreH2Test
            skip-docker-tests: true
          - lane: mysql
            task: coreMySQLTest
            skip-docker-tests: false
          - lane: postgresql
            task: corePostgreSQLTest
            skip-docker-tests: false
    timeout-minutes: 120
    needs: test
    if: >-
      inputs.source-changes == 'true' &&
      inputs.maintenance-module-only-changes != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-and-sync
        with:
          base-ref: ${{ inputs.base-ref }}
          base-sha: ${{ inputs.base-sha }}
          head-repository: ${{ inputs.head-repository }}
          head-sha: ${{ inputs.head-sha }}
          sync: ${{ inputs.sync }}

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: ${{ matrix.java-version }}

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Run core ${{ matrix.lane }} lane
        run: |
          ./gradlew :core:${{ matrix.task }} \
            -PskipWeb=true \
            -PskipITs \
            -PskipDockerTests=${{ matrix.skip-docker-tests }}

      - name: Validate core test evidence
        run: |
          junit_xml="$(find "core/build/test-results/${{ matrix.task }}" \
            -type f -name 'TEST-*.xml' -print -quit)"
          test -n "${junit_xml}"
          test -s "${junit_xml}"
          test -s "build/reports/tests/core/${{ matrix.task }}/index.html"
          test -s "core/build/jacoco/${{ matrix.task }}.exec"

      - name: Upload core test evidence
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.lane }}-test-evidence
          path: |
            core/build/test-results/${{ matrix.task }}
            build/reports/tests/core/${{ matrix.task }}
            core/build/jacoco/${{ matrix.task }}.exec
          if-no-files-found: error
          retention-days: 1

      - name: Upload core test report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: core test report ${{ matrix.lane }}
          path: |
            build/reports/tests/core
            core/build/test-results

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ test, medium-test, core-test ]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (inputs.maintenance-module-only-changes == 'true' ||
      (needs['medium-test'].result == 'success' && needs['core-test'].result == 'success'))
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-and-sync
        with:
          base-ref: ${{ inputs.base-ref }}
          base-sha: ${{ inputs.base-sha }}
          head-repository: ${{ inputs.head-repository }}
          head-sha: ${{ inputs.head-sha }}
          sync: ${{ inputs.sync }}
        id: coverage-checkout

      - uses: ./.github/actions/setup-java-toolchains
        if: >-
          steps.coverage-checkout.outputs.pull-request == 'true' &&
          inputs.maintenance-module-only-changes != 'true'
        with:
          java-version: 17

      - name: Fetch base branch for coverage diff
        if: steps.coverage-checkout.outputs.pull-request == 'true'
        run: git fetch origin ${{ steps.coverage-checkout.outputs.base-ref }} --depth=1

      - name: Download coverage data
        if: steps.coverage-checkout.outputs.pull-request == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          merge-multiple: true

      - name: Download core test evidence
        if: >-
          steps.coverage-checkout.outputs.pull-request == 'true' &&
          inputs.maintenance-module-only-changes != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: core-*-test-evidence
          path: core-test-evidence

      - name: Generate combined core coverage
        if: >-
          steps.coverage-checkout.outputs.pull-request == 'true' &&
          inputs.maintenance-module-only-changes != 'true'
        run: |
          mkdir -p core/build/jacoco
          for task in coreUnitTest coreH2Test coreMySQLTest corePostgreSQLTest; do
            exec_file="$(find core-test-evidence -path "*/core/build/jacoco/${task}.exec" -print -quit)"
            test -n "${exec_file}"
            install -m 0644 "${exec_file}" "core/build/jacoco/${task}.exec"
          done
          ./gradlew \
            :core:jacocoTestReport \
            -PcoreSuiteCoverage=true \
            -PskipWeb=true
          test -s core/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Generate Coverage Report
        id: coverage
        if: steps.coverage-checkout.outputs.pull-request == 'true'
        run: |
          python3 dev/ci/jacoco_report.py \
            --base-ref "${{ steps.coverage-checkout.outputs.base-ref }}" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}" \
            --repo-url "${{ github.event.pull_request.head.repo.html_url || format('{0}/{1}', github.server_url, github.repository) }}" \
            --min-overall 40 \
            --min-changed 60 \
            --output coverage-report.md

      # coverage-comment.yml posts the report for pull_request runs in this repository.
      - name: Save PR number
        if: github.event_name == 'pull_request' && steps.coverage.outputs.has_reports == 'true'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload Coverage Report
        if: steps.coverage-checkout.outputs.pull-request == 'true' && steps.coverage.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage-report.md
            pr-number.txt

      - name: Output Coverage Info
        if: steps.coverage-checkout.outputs.pull-request == 'true' && steps.coverage.outputs.has_reports == 'true'
        run: |
          echo "Total coverage ${{ steps.coverage.outputs.coverage-overall }}"
          echo "Changed Files coverage ${{ steps.coverage.outputs.coverage-changed-files }}"
