name: build

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      base-ref:
        type: string
        required: false
        default: ''
      base-sha:
        type: string
        required: false
        default: ''
      head-repository:
        type: string
        required: false
        default: ''
      head-sha:
        type: string
        required: false
        default: ''
      sync:
        type: string
        required: false
        default: ''
      source-changes:
        type: string
        required: false
        default: ''
      spark-connector-changes:
        type: string
        required: false
        default: ''
      mcp-server-changes:
        type: string
        required: false
        default: ''
    outputs:
      medium-shards:
        value: ${{ jobs.build.outputs.medium-shards }}

concurrency:
  group: fork-ci-build-${{ inputs.head-sha || github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  compile-check:
    runs-on: ubuntu-latest
    if: inputs.source-changes != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-and-sync
        with:
          base-ref: ${{ inputs.base-ref }}
          base-sha: ${{ inputs.base-sha }}
          head-repository: ${{ inputs.head-repository }}
          head-sha: ${{ inputs.head-sha }}
          sync: ${{ inputs.sync }}

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Build with Gradle
        run: |
          ./gradlew assemble -PskipWeb=true

  # To check the spark-connector is compatible with scala2.13
  spark-connector-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.spark-connector-changes == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-and-sync
        with:
          base-ref: ${{ inputs.base-ref }}
          base-sha: ${{ inputs.base-sha }}
          head-repository: ${{ inputs.head-repository }}
          head-sha: ${{ inputs.head-sha }}
          sync: ${{ inputs.sync }}

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'gradle'

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Build with Scala2.13
        run: |
          ./gradlew :spark-connector:spark-3.5:build -PscalaVersion=2.13 -PskipITs -PskipDockerTests=false -PskipWeb=true

      - name: Upload unit tests report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit test report
          path: |
            build/reports
            spark-connector/**/*.log

  # Compiles main and test sources after the lint suite passes. The integration test suites and the
  # unit-test suite wait for this suite, so a compile error starts no Docker test.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: inputs.source-changes == 'true'
    outputs:
      medium-shards: ${{ steps.shards.outputs.medium-shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-and-sync
        with:
          base-ref: ${{ inputs.base-ref }}
          base-sha: ${{ inputs.base-sha }}
          head-repository: ${{ inputs.head-repository }}
          head-sha: ${{ inputs.head-sha }}
          sync: ${{ inputs.sync }}

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Test publish to local
        run: ./gradlew publishToMavenLocal -PskipWeb=true -x test

      # testClasses compiles the test sources too, so a test that does not compile fails here.
      # shadedJarTest is a test that `check` runs; it runs in the test stage instead.
      - name: Build without tests
        run: >-
          ./gradlew build testClasses -x test
          -x :plugins:k8s-job-executor:shadedJarTest
          -PskipWeb=true
          -x :clients:client-python:build
          ${{ inputs.mcp-server-changes != 'true' && '-x :mcp-server:build -x :mcp-server:pylint -x :web-v2:web:build' || '' }}

      - name: List medium test shards
        id: shards
        run: ./gradlew ciShards -PskipWeb=true
