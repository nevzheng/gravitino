name: Backend Integration Test

# Controls when the workflow will run
on:
  push:
    branches: [ "main", "branch-*" ]
  pull_request:
    branches: [ "main", "branch-*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            source_changes:
              - .github/**
              - api/**
              - bin/**
              - catalogs/**
              - clients/client-java/**
              - clients/client-java-runtime/**
              - clients/filesystem-hadoop3/**
              - clients/cli/**
              - common/**
              - conf/**
              - core/**
              - lance/**
              - dev/**
              - gradle/**
              - iceberg/**
              - integration-test-common/**
              - meta/**
              - scripts/**
              - server/**
              - bundles/**
              - server-common/**
              - build.gradle.kts
              - gradle.properties
              - gradlew
              - settings.gradle.kts
    outputs:
      source_changes: ${{ steps.filter.outputs.source_changes }}

  BackendIT:
    needs: changes
    if: needs.changes.outputs.source_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        architecture: [ linux/amd64 ]
        java-version: [ 17 ]
        backend: [ h2, mysql, postgresql ]
        test-mode: [ embedded, deploy ]
        # One job per shard. Shards are defined in build.gradle.kts.
        shard: [ hive, lakehouse, others ]
        exclude:
          - test-mode: 'embedded'
            backend: 'mysql'
          - test-mode: 'embedded'
            backend: 'postgresql'
          - test-mode: 'deploy'
            backend: 'h2'
        include:
          - shard: hive
            test-task: backendITHive
          - shard: lakehouse
            test-task: backendITLakehouse
          - shard: others
            test-task: backendITOthers
    uses: ./.github/workflows/backend-integration-test-action.yml
    with:
      architecture: ${{ matrix.architecture }}
      java-version: ${{ matrix.java-version }}
      backend: ${{ matrix.backend }}
      test-mode: ${{ matrix.test-mode }}
      shard: ${{ matrix.shard }}
      test-task: ${{ matrix.test-task }}
