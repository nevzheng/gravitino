name: 'Setup Java Toolchains'
description: 'Install a primary JDK and JDK 24 (for Trino), and set up Gradle with its dependency cache; Gradle finds JDK 24 through fromEnv in gradle.properties'

inputs:
  java-version:
    description: 'Primary Java version'
    default: '17'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        java-version: 24
        distribution: temurin

    - uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin

    # setup-gradle caches the Gradle user home. It writes the cache only on the default branch, so
    # PR runs read main's cache and cannot fill the repository's 10 GB with per-PR entries.
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
