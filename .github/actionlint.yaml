# actionlint project config. Keep this file small: it is for repository facts
# actionlint cannot infer, not for silencing findings.
#
# Why this shape:
# - No paths.ignore. An ignore list is how other Apache repos went green
#   without fixing run: quoting. If a finding is a linter limit, disable it
#   next to that line (see chart-test.yaml SC1090), not here.
# - config-variables: null. This repo does not use vars.*, and an empty list
#   would forbid every vars.FOO. null turns that check off.
# - self-hosted-runner.labels: []. Required CI uses GitHub-hosted
#   ubuntu-latest. Unknown labels should still fail.
# - ShellCheck stays on (actionlint default when `shellcheck` is on PATH).
#   ubuntu-latest images ship it. Do not pass -shellcheck= in CI.
# - Do not use rhysd/actionlint-action or docker://rhysd/actionlint; neither
#   is on the ASF org allowlist. CI downloads a pinned linux tarball instead.
#
# See https://github.com/rhysd/actionlint/blob/v1.7.12/docs/config.md
self-hosted-runner:
  labels: []

config-variables: null
