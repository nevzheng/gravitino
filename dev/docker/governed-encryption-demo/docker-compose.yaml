name: gravitino-governed-encryption-demo

services:
  keystore-bootstrap:
    image: eclipse-temurin:17-jdk
    user: "0:0"
    entrypoint: ["/bin/bash", "/bootstrap/keystore-bootstrap.sh"]
    volumes:
      - ./keystore-bootstrap.sh:/bootstrap/keystore-bootstrap.sh:ro
      - kms-keystore:/run/secrets/kms
    restart: "no"
    security_opt:
      - no-new-privileges:true

  iceberg-rest:
    image: gravitino-governed-encryption-iceberg-rest-demo:local
    build:
      context: .
      dockerfile: Dockerfile.iceberg-rest
    entrypoint: ["/bin/bash", "-lc"]
    command: ["umask 0002 && exec ./bin/gravitino-iceberg-rest-server.sh run"]
    ports:
      - "${ICEBERG_REST_HOST_PORT:-9001}:9001"
    volumes:
      - warehouse:/warehouse
    depends_on:
      keystore-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9001/iceberg/v1/config"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    restart: unless-stopped

  gravitino:
    image: gravitino-governed-encryption-demo:local
    build:
      context: .
      dockerfile: Dockerfile.gravitino
    ports:
      - "${GRAVITINO_HOST_PORT:-8090}:8090"
    volumes:
      - warehouse:/warehouse
    depends_on:
      iceberg-rest:
        condition: service_healthy
      keystore-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/api/health/ready"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    restart: unless-stopped

  spark:
    image: gravitino-governed-encryption-spark-demo:local
    build:
      context: .
      dockerfile: Dockerfile.spark
    command:
      - /bin/bash
      - -lc
      - trap 'exit 0' TERM INT; while :; do sleep 3600 & wait $!; done
    group_add:
      - "0"
    volumes:
      - kms-keystore:/run/secrets/kms:ro
      - warehouse:/warehouse
      - ./:/opt/demo:ro
    depends_on:
      gravitino:
        condition: service_healthy
      keystore-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/run/secrets/kms/demo.p12"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  kms-keystore:
    name: gravitino-governed-encryption-kms-keystore
  warehouse:
    name: gravitino-governed-encryption-warehouse
